[tool.poetry]
name = "calculator"
version = "0.1.0"
description = ""
authors = ["peyro <peyrovskaaa@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fastapi = ">=0.116.1,<0.117.0"
alembic = ">=1.16.5,<2.0.0"
pydantic-settings = ">=2.10.1,<3.0.0"
fastapi-problem = ">=0.11.5,<0.12.0"
redis = ">=6.4.0,<7.0.0"
loguru = ">=0.7.3,<0.8.0"
fastapi-cache2 = ">=0.2.2,<0.3.0"
currencyconverter = ">=0.18.9,<0.19.0"
pandas = ">=2.3.2,<3.0.0"
grpcio = ">=1.74.0,<2.0.0"
protobuf = ">=6.32.0,<7.0.0"
grpcio-health-checking = ">=1.74.0,<2.0.0"
psycopg2-binary = ">=2.9.10,<3.0.0"
asyncpg = ">=0.30.0,<0.31.0"
AuthTools = { git = "https://github.com/AutoFolwark/shared_auth.git", tag = "v0.1.8" }
greenlet = ">=3.2.4,<4.0.0"
fastapi-pagination = ">=0.15.0,<0.16.0"
grpcio-reflection = ">=1.76.0,<2.0.0"
uvicorn = ">=0.30.0"

[tool.poetry.group.dev.dependencies]
aiosqlite = "^0.21.0"
pytest = "^8.4.2"
pre-commit = "^4.2.0"
ruff = "^0.11.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    "app/rpc_client_server/gen",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI Depends() in default arguments
    "B904",  # raise-without-from inside except
    "E402",  # module import not at top of file (scripts)
    "E501",  # line too long
    "UP038",  # isinstance with tuple of types
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
